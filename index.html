    <p class="lead" data-t="lead">Esta página es privada para la familia. Escribe la contraseña.</p>

        <button type="button" class="show" id="show" aria-label="Mostrar la contraseña" aria-pressed="false">Ver</button>

      <label class="remember"><input type="checkbox" id="remember" checked /> <span data-t="remember">Recordarme en este teléfono</span></label>

      <p class="err" id="err" role="alert" aria-live="assertive"></p>
    </form>
    <p class="foot" data-t="foot">Si no tienes la contraseña, pregúntale a Orlando o a otro miembro de la familia.</p>
