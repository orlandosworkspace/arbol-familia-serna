    <p class="lead">Esta página es privada para la familia. Escribe la contraseña.</p>
    <form id="f" autocomplete="on">
      <label class="pw" for="pw">Contraseña</label>

        <button type="button" class="show" id="show" aria-label="Mostrar la contraseña" aria-pressed="false">Ver</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked /> Recordarme en este teléfono</label>
      <button type="submit" class="go" id="go">Entrar</button>
      <p class="err" id="err" role="alert" aria-live="assertive"></p>
    </form>
    <p class="foot">Si no tienes la contraseña, pregúntale a Orlando o a otro miembro de la familia.</p>

      }).then(function (plain) { return new TextDecoder().decode(plain); });
    }
    function show_app(html) {
      // Replace this login page with the decrypted app (only after the login page finished loading).
      function go() { document.open(); document.write(html); document.close(); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go, { once: true });
      else setTimeout(go, 0);
    }
    if (!window.crypto || !crypto.subtle) {
      err.textContent = 'Este navegador es muy viejo para abrir la página. Prueba con Chrome o Safari actualizados.';
      go.disabled = true; return;
    }
    // "Recordarme": the derived key (never the password) is kept on this phone only.
    var s = store(), saved = s && s.getItem(KEY);
    if (saved) {
      document.body.style.visibility = 'hidden';
      open(b64(saved).buffer).then(show_app, function () {
        s.removeItem(KEY); document.body.style.visibility = '';
      });
    }
    show.addEventListener('click', function () {
      var on = pw.type === 'password';
      pw.type = on ? 'text' : 'password';
      show.textContent = on ? 'Ocultar' : 'Ver';
      show.setAttribute('aria-pressed', on ? 'true' : 'false');
      show.setAttribute('aria-label', on ? 'Ocultar la contraseña' : 'Mostrar la contraseña');
      pw.focus();
    });
    pw.addEventListener('input', function () { err.textContent = ''; });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = pw.value;
      if (!pass) { err.textContent = 'Escribe la contraseña.'; pw.focus(); return; }
      err.textContent = ''; go.disabled = true; go.textContent = 'Abriendo…';
      var bits;
      derive(pass).then(function (b) { bits = b; return open(b); }).then(function (html) {
        var st = store();
        if (st) { if (remember.checked) st.setItem(KEY, tob64(bits)); else st.removeItem(KEY); }
        show_app(html);
      }, function () {
        go.disabled = false; go.textContent = 'Entrar';
        err.textContent = 'Contraseña incorrecta';
        pw.select();
      });
    });
  })();
  </script>
